[package]
name = "filesystem-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "filesystem_plugin"
path = "src/lib.rs"

[[bin]]
name = "filesystem"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
