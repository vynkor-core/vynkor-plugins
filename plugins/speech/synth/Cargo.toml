[package]
name = "speech-synth"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "synth_engine"
path = "src/lib.rs"

[dependencies]
vynkor-sdk = "0.0.5"
vynkor-wire = "0.0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sherpa-onnx = "1.13"
opus = "0.3"
mp3lame-encoder = "=0.2.5"
