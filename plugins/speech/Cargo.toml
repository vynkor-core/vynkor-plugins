[package]
name = "speech-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "speech"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
vynkor-wire = "0.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde_json = "1"
synth-engine = { path = "synth", package = "speech-synth" }
listen-engine = { path = "listen", package = "speech-listen" }
