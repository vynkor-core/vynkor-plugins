[package]
name = "email-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "email_plugin"
path = "src/lib.rs"

[[bin]]
name = "email"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
vynkor-wire = "0.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
imap = "3.0.0-alpha.15"
native-tls = "0.2"
