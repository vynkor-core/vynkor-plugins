[package]
name = "mic-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mic_plugin"
path = "src/lib.rs"

[[bin]]
name = "mic"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
vynkor-wire = "0.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
