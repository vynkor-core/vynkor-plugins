[package]
name = "tts-plugin"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "tts_plugin"
path = "src/lib.rs"

[[bin]]
name = "tts"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
vynkor-wire = "0.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sherpa-onnx = "1.13"
opus = "0.3"
mp3lame-encoder = "=0.2.5"
