[package]
name = "clipboard-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "clipboard_plugin"
path = "src/lib.rs"

[[bin]]
name = "clipboard"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-wire = "0.0.2"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
