[package]
name = "vynkor-plugin-manifest"
version = "0.1.0"
edition = "2021"
description = "Convert an on-disk plugin.json's actions[] into wire ActionSpecs for PluginManifest.action_specs — shared by plugins registering with the vynkor kernel."
publish = false

[lib]
name = "vynkor_plugin_manifest"
path = "src/lib.rs"

[dependencies]
# a range, not a pin: each plugin unifies it with its own vynkor-sdk
# version, so plugins can move to a newer SDK one at a time
vynkor-sdk = ">=0.0.3, <0.0.6"
serde_json = "1"
tracing = "0.1"
