[package]
name = "vynkor-plugin-manifest"
version = "0.1.0"
edition = "2021"
description = "Convert an on-disk plugin.json's actions[] into wire ActionSpecs for PluginManifest.action_specs — shared by plugins registering with the vynkor kernel."
publish = false

[lib]
name = "vynkor_plugin_manifest"
path = "src/lib.rs"

[dependencies]
# Pinned, not a range: a range resolves to the newest SDK here while each
# plugin pins 0.0.3, landing two SDK/wire copies (and two ActionSpec types)
# in every plugin. Bump all plugins plus this pin together when migrating.
vynkor-sdk = "=0.0.3"
serde_json = "1"
tracing = "0.1"
