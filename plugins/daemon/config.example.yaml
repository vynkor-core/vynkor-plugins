# daemon plugin config. Copy the relevant keys into the plugin's `env:` list
# in the kernel config (or the drop-in's `env:`) — the supervisor exports
# them before spawning. Every key is optional; defaults below.

# Start with the background listen loop ON (default false — enable at
# runtime via daemon_enable instead).
DAEMON_PLUGIN_ENABLED=false

# Listen mode — how a turn decides the user stopped talking:
#   window (default) — fixed capture window below; v0.1 behavior.
#   vad              — capture ends on stt's speech-ended event (needs
#                      STT_PLUGIN_VAD=on on the stt side). Hands-free:
#                      enable once, talk whenever. Falls back to window
#                      behavior if stt's VAD never fires (caps below).
#   ptt              — push-to-talk via the hotkey plugin: idle until
#                      hotkey_pressed, capture while held, end on release.
DAEMON_PLUGIN_MODE=window

# window mode: mic capture window per turn.
DAEMON_PLUGIN_TURN_MS=6000

# vad mode: give up when no speech starts within this budget (turn ends
# "silent"), and hard-cap one utterance even without an ended event.
DAEMON_PLUGIN_VAD_WAIT_MS=30000
DAEMON_PLUGIN_VAD_MAX_UTTERANCE_MS=20000

# ptt mode: which hotkey binding triggers a turn (hotkey plugin's binding
# id), and the stuck-key auto-release cap.
DAEMON_PLUGIN_PTT_BINDING=ptt
DAEMON_PLUGIN_PTT_MAX_HOLD_MS=60000

# Idle gap between loop turns (all modes; ptt ticks stay idle regardless).
DAEMON_PLUGIN_GAP_MS=2000

# Capture parameters negotiated with stt_listen_start / mic_start.
DAEMON_PLUGIN_SAMPLE_RATE_HZ=16000
DAEMON_PLUGIN_CHUNK_MS=100
DAEMON_PLUGIN_STREAM_ID=7

# Plugin slug serving stt_* (mic streams PCM to it; VAD events come as
# plugin.<slug>.*). `stt` for the standalone plugin, `speech` for the merged
# one. mic's MIC_PLUGIN_IPC_TARGETS must list the same slug — otherwise the
# kernel drops the audio and every turn fails with "no audio buffered".
DAEMON_PLUGIN_STT_TARGET=stt

# Speech output (tts_synthesize → sound_play). sherpa is fully offline;
# openai/elevenlabs need tts's own key allowlist + vault/env.
DAEMON_PLUGIN_TTS_PROVIDER=sherpa
DAEMON_PLUGIN_TTS_VOICE=af_heart
DAEMON_PLUGIN_TTS_FORMAT=wav

# Agent goal budget per turn, and IPC timeouts (goal runs long — LLM loop).
DAEMON_PLUGIN_MAX_STEPS=6
DAEMON_PLUGIN_TIMEOUT_MS=30000
DAEMON_PLUGIN_GOAL_TIMEOUT_MS=120000

# Secured-kernel only (operator mints per plugin; claims override manifest):
# VYN_JWT_SECRET=<kernel jwt_secret>
# VYN_JWT_TOKEN=<jwt with sub=daemon, permissions=[PERMISSION_AUDIO, PERMISSION_EVENT_PUBLISH]>
