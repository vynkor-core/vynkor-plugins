[package]
name = "phone-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "phone_plugin"
path = "src/lib.rs"

[[bin]]
name = "phone"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.5"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
