[package]
name = "secrets-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "secrets_plugin"
path = "src/lib.rs"

[[bin]]
name = "secrets"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
