[package]
name = "notify-plugin"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "notify_plugin"
path = "src/lib.rs"

[[bin]]
name = "notify"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-wire = "0.0.2"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
