[package]
name = "agent-plugin"
version = "0.1.8"
edition = "2021"
publish = false

[lib]
name = "agent_plugin"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.5"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
