[package]
name = "mqtt-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mqtt_plugin"
path = "src/lib.rs"

[[bin]]
name = "mqtt"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-wire = "0.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
