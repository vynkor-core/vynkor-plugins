[package]
name = "sound-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sound_plugin"
path = "src/lib.rs"

[[bin]]
name = "sound"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-plugin-manifest = { path = "../_shared/plugin-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde_json = "1"
async-trait = "0.1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
